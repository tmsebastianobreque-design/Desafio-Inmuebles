{% extends 'base.html' %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 mt-5 mb-5">
      
      <!-- Contenedor estético tipo Tarjeta limpia -->
      <div class="card shadow-sm p-4 bg-white rounded">
        <h3 class="text-center mb-4 fw-bold">
          Actualizar mis Datos
        </h3>

        <form method="post" novalidate>
          {% csrf_token %}

          <!-- Errores generales -->
          {% if form.non_field_errors %}
            <div class="alert alert-danger">
              {{ form.non_field_errors }}
            </div>
          {% endif %}

          <h5 class="mb-3 fw-bold text-secondary">Información Personal</h5>

          <!-- Campo: Nombres -->
          <div class="mb-3">
            <label for="first_name" class="form-label fw-semibold">Nombres:</label>
            <input type="text" name="first_name" id="first_name" class="form-control" value="{{ user.first_name }}">
          </div>

          <!-- Campo: Apellidos -->
          <div class="mb-3">
            <label for="last_name" class="form-label fw-semibold">Apellidos:</label>
            <input type="text" name="last_name" id="last_name" class="form-control" value="{{ user.last_name }}">
          </div>

          <!-- Campo: Correo -->
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Correo electrónico:</label>
            <input type="email" name="email" id="email" class="form-control" value="{{ user.email }}">
          </div>

          <hr class="my-4 text-muted">
          <h5 class="mb-3 fw-bold text-secondary">Contacto y Ubicación</h5>

          <!-- Campo: Dirección -->
          <div class="mb-3">
            <label for="direccion" class="form-label fw-semibold">Dirección:</label>
            <input type="text" name="direccion" id="direccion" class="form-control" value="{% if perfil %}{{ perfil.direccion }}{% endif %}">
          </div>

          <!-- Campo: Teléfono -->
          <div class="mb-4">
            <label for="telefono" class="form-label fw-semibold">Teléfono personal:</label>
            <input type="text" name="telefono" id="telefono" class="form-control" value="{% if perfil %}{{ perfil.telefono }}{% endif %}">
          </div>

          <!-- Botones de Acción -->
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary py-2 fw-bold">Guardar Cambios</button>
            <a href="{% url 'gestion_inmuebles:perfil' %}" class="btn btn-light py-2 fw-semibold text-muted">Cancelar</a>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
